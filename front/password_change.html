<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🔒 パスワード変更</title>
    <link ref="stylesheet" href="/css/password_change.css">
</head>
<body>

<div class="box">
    <h2>🔒 パスワード変更</h2>
    <p style="font-size: 12px; color: #666; text-align: center;">メールアドレスとパスワードを入力してください</p>
    
    <input type="email" id="email" placeholder="現在のメールアドレス" required>
    <input type="password" id="current-password" placeholder="現在のパスワード" required>
    <input type="password" id="new-password" placeholder="新しいパスワード" required>
    
    <button onclick="changePassword()">パスワードを更新</button>
    <div class="link"><a href="/chat.html"> チャット画面に戻る</a></div>
    <div id="message"></div>
</div>

<script src="/js/password_change.js"></script>
</body>
</html>
